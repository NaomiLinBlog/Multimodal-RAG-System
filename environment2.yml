name: multimodal-rag2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.16
  - pip
  - pip:
    # Core dependencies
    - torch>=2.4.1
    - transformers==4.48.0
    - huggingface-hub>=0.24.0,<1.0
    - accelerate>=1.0.1
    
    # LLM and embedding related
    - bitsandbytes>=0.45.0
    - flash-attn
    - byaldi
    - sentence-transformers>=2.2.2
    
    # Document processing
    - PyMuPDF>=1.23.8
    - python-multipart
    - pypdf>=3.0.0
    - pdf2image
    
    # Data processing
    - numpy>=1.24.4
    - pandas>=2.0.3
    - scikit-learn>=1.3.2
    
    # API and server
    - fastapi>=0.115.4
    - uvicorn>=0.32.0
    - pydantic>=2.9.2
    
    # LlamaIndex related
    - llama-index>=0.9.48
    - llama-index-embeddings-huggingface>=0.1.0
    - llama-index-llms-huggingface>=0.1.0
    - llama-index-readers-file>=0.1.0
    
    # Utilities
    - tqdm>=4.65.0
    - pillow>=10.0.0
    - requests>=2.31.0
    - python-dateutil>=2.8.2
    - PyYAML>=6.0.1